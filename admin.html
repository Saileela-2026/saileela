<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saileela Store — Admin Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Spectral:wght@300;400;500;600&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
<style>
:root{--maroon:#6E0603;--maroon2:#4C0301;--ink:#2A1810;--paper:#F7EFDF;--card:#fff;--line:#E7DBC2;--saffron:#EF7F1A;--marigold:#E0A32E;--kumkum:#C4281A;--green:#2E7D46;--muted:#8A755A;--brass:#B18E3E;
--shadow:0 10px 30px rgba(60,20,10,.10);--r:12px}
*{box-sizing:border-box}
body{margin:0;font-family:"Spectral",Georgia,serif;color:var(--ink);background:var(--paper);font-size:15px}
h1,h2,h3,h4{font-family:"Fraunces",serif;margin:0}
.deva{font-family:"Tiro Devanagari Hindi",serif}
a{color:inherit}
button,input,select,textarea{font-family:inherit;font-size:14px}
input,select,textarea{width:100%;padding:.62em .7em;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input:focus,select,textarea:focus{outline:2px solid rgba(239,127,26,.35);outline-offset:0;border-color:var(--saffron)}
label{display:block;font-size:.82rem;color:var(--muted);font-weight:500;margin-bottom:10px}
label span,label>b{display:block;margin-bottom:4px}
.btn{display:inline-flex;align-items:center;gap:.5em;padding:.6em 1.1em;border:none;border-radius:8px;background:var(--maroon);color:#fff;font-weight:600;cursor:pointer;font-size:.85rem;transition:.15s}
.btn:hover{background:var(--maroon2)}
.btn.gold{background:var(--saffron)}.btn.gold:hover{background:#d06f12}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}.btn.ghost:hover{border-color:var(--saffron);color:var(--kumkum)}
.btn.sm{padding:.4em .7em;font-size:.78rem}
.btn.danger{background:#fff;border:1px solid #E3B3AB;color:var(--kumkum)}.btn.danger:hover{background:#FBEDEA}
.chip{display:inline-block;padding:2px 9px;border-radius:20px;font-size:.7rem;font-weight:600;letter-spacing:.02em}
.chip.on{background:#E4F3E9;color:var(--green)}.chip.off{background:#F1E4E2;color:var(--kumkum)}
.chip.badge{background:#FBE7CF;color:#9A6412}

/* login */
#gate{position:fixed;inset:0;background:linear-gradient(160deg,var(--maroon),var(--maroon2));display:grid;place-items:center;z-index:100}
#gate .box{background:#fff;border-radius:16px;padding:40px;width:min(380px,92vw);text-align:center;box-shadow:var(--shadow)}
#gate img{width:66px;height:66px;margin:0 auto 14px;display:block}
#gate h2{font-size:1.5rem;margin-bottom:4px}
#gate p{color:var(--muted);font-size:.85rem;margin:0 0 20px}
#gate .err{color:var(--kumkum);font-size:.8rem;min-height:1em;margin-top:8px}

/* shell */
.shell{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.side{background:var(--maroon);color:#F7E7C8;padding:20px 16px;position:sticky;top:0;height:100vh;overflow:auto}
.side .brand{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.side .brand img{width:40px;height:40px}
.side .brand b{font-family:"Fraunces";font-size:1.15rem;color:#fff;line-height:1}
.side .brand small{display:block;color:#E7B98F;font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;margin-top:3px}
.navbtn{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:none;color:#EAD4B4;padding:11px 12px;border-radius:9px;cursor:pointer;font-size:.9rem;font-weight:500;margin-bottom:2px}
.navbtn:hover{background:rgba(255,255,255,.08);color:#fff}
.navbtn.active{background:var(--saffron);color:#fff}
.navbtn svg{width:18px;height:18px;flex:none}
.side .foot{margin-top:18px;padding-top:16px;border-top:1px solid rgba(255,255,255,.14);font-size:.72rem;color:#E7B98F;line-height:1.6}
.side .foot a{color:var(--marigold)}
.main{padding:26px 30px 60px;max-width:1100px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;gap:14px;flex-wrap:wrap}
.topbar h1{font-size:1.7rem}
.topbar .sub{color:var(--muted);font-size:.85rem;margin-top:2px}

.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow)}
.stat b{font-family:"Fraunces";font-size:1.9rem;display:block;color:var(--maroon)}
.stat span{color:var(--muted);font-size:.8rem}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:20px;overflow:hidden}
.panel .ph{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel .ph h3{font-size:1.15rem}
.panel .pb{padding:20px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-family:"Spectral";font-weight:600;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
.ticon{width:38px;height:38px;border-radius:8px;background:linear-gradient(180deg,#FCF5E1,#EFDDB4);border:1px solid var(--line);display:grid;place-items:center}
.ticon svg{width:24px;height:24px}
.rowacts{display:flex;gap:6px;justify-content:flex-end}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.ck{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--ink)}
.ck input{width:auto}
.hint{font-size:.78rem;color:var(--muted);margin:2px 0 0}
.note{background:#FBF3E3;border:1px solid #EBD9B4;border-radius:10px;padding:12px 14px;font-size:.82rem;color:#7A5A22;margin-bottom:18px}
.list-row{display:grid;gap:10px;align-items:center;margin-bottom:10px}
.editor-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.editor-row .rm{flex:none}
.save-bar{display:flex;gap:10px;align-items:center;margin-top:14px}
.saved{color:var(--green);font-size:.82rem;opacity:0;transition:.2s}
.saved.show{opacity:1}

/* modal */
#modal{position:fixed;inset:0;background:rgba(40,15,8,.55);display:none;place-items:center;z-index:80;padding:20px}
#modal.open{display:grid}
#modal .m{background:#fff;border-radius:14px;width:min(560px,96vw);max-height:92vh;overflow:auto;box-shadow:var(--shadow)}
#modal .mh{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
#modal .mb{padding:22px}
#modal .mb label{margin-bottom:14px}
#modal .mf{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;position:sticky;bottom:0;background:#fff}
.x{background:none;border:none;cursor:pointer;color:var(--muted);font-size:1.4rem;line-height:1}
@media(max-width:820px){.shell{grid-template-columns:1fr}.side{position:static;height:auto}.cards{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="site-header" style="display:none"></div>
<div id="site-footer" style="display:none"></div>

<!-- login gate -->
<div id="gate">
  <div class="box">
    <img src="saileela-logo.png" alt="Saileela">
    <h2>Saileela Admin</h2>
    <p class="deva">॥ हर हर साई • घर घर साई ॥</p>
    <input id="gatePass" type="password" placeholder="Enter passcode" onkeydown="if(event.key==='Enter')tryLogin()">
    <div class="err" id="gateErr"></div>
    <button class="btn gold" style="width:100%;justify-content:center;margin-top:12px" onclick="tryLogin()">Enter dashboard</button>
    <p style="font-size:.72rem;color:#a08a70;margin-top:14px">Prototype passcode: <b>saileela</b> · client-side only, not real security.</p>
  </div>
</div>

<div class="shell" id="shell" style="display:none">
  <aside class="side">
    <div class="brand"><img src="saileela-logo.png" alt=""><div><b>Saileela</b><small>Admin</small></div></div>
    <nav id="nav"></nav>
    <div class="foot">Changes save to this browser.<br>Use <b>Data → Export</b> to back up or hand to your developer.<br><a href="index.html">← View store</a></div>
  </aside>
  <main class="main">
    <div id="view"></div>
  </main>
</div>

<!-- modal -->
<div id="modal"><div class="m"><div class="mh"><h3 id="mTitle">Edit</h3><button class="x" onclick="closeModal()">×</button></div><div class="mb" id="mBody"></div><div class="mf"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" id="mSave">Save</button></div></div></div>

<script src="app.js"></script>
<script>
/* ============ Saileela Admin ============ */
const D=()=>Store.load();
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const val=id=>{const el=document.getElementById(id);return el?el.value.trim():'';};
const money=n=>Saileela.money(n);
let saveTimer;
function flash(){const s=document.querySelector('.saved');if(s){s.classList.add('show');clearTimeout(saveTimer);saveTimer=setTimeout(()=>s.classList.remove('show'),1600);}}

/* ---- login ---- */
function tryLogin(){
  const p=document.getElementById('gatePass').value;
  if(p==='saileela'){sessionStorage.setItem('sl_admin','1');show();}
  else{document.getElementById('gateErr').textContent='Incorrect passcode. Try again.';}
}
function show(){document.getElementById('gate').style.display='none';document.getElementById('shell').style.display='grid';renderNav();go('overview');}

/* ---- nav ---- */
const TABS=[
  ['overview','Overview','<path d="M4 13h7V4H4zM13 20h7v-9h-7zM13 4v5h7V4zM4 20h7v-5H4z"/>'],
  ['products','Products','<path d="M3 7l9-4 9 4-9 4-9-4zM3 7v10l9 4 9-4V7"/>'],
  ['categories','Categories','<path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/>'],
  ['orders','Orders','<path d="M6 2h9l5 5v15H6zM15 2v5h5"/>'],
  ['content','Content','<path d="M4 5h16M4 12h16M4 19h10"/>'],
  ['tv','Saileela TV','<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M8 21h8"/>'],
  ['settings','Settings','<circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.6-2-3.4-2.4 1a7 7 0 0 0-1.7-1L14.5 2h-5l-.3 2.6a7 7 0 0 0-1.7 1l-2.4-1-2 3.4L3.1 11a7 7 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 1.7 1l.3 2.4h5l.3-2.6a7 7 0 0 0 1.7-1l2.4 1 2-3.4-2-1.6a7 7 0 0 0 .1-1Z"/>'],
  ['data','Data','<path d="M4 6c0-1.7 3.6-3 8-3s8 1.3 8 3-3.6 3-8 3-8-1.3-8-3zM4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>']
];
let tab='overview';
function renderNav(){
  document.getElementById('nav').innerHTML=TABS.map(([id,label,ic])=>
    `<button class="navbtn ${id===tab?'active':''}" onclick="go('${id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">${ic}</svg>${label}</button>`).join('');
}
function go(t){tab=t;renderNav();({overview,products,categories,orders,content,tv,settings,data})[t]();window.scrollTo(0,0);}

/* ---- modal ---- */
function openModal(title,bodyHtml,onSave){
  document.getElementById('mTitle').textContent=title;
  document.getElementById('mBody').innerHTML=bodyHtml;
  document.getElementById('modal').classList.add('open');
  document.getElementById('mSave').onclick=onSave;
}
function closeModal(){document.getElementById('modal').classList.remove('open');}

/* ================= OVERVIEW ================= */
function overview(){
  const d=D();const orders=d.orders||[];
  const revenue=orders.filter(o=>o.status!=='Cancelled').reduce((s,o)=>s+(+o.total||0),0);
  const low=d.products.filter(p=>(+p.stock||0)<=20).length;
  document.getElementById('view').innerHTML=`
    <div class="topbar"><div><h1>Overview</h1><div class="sub">Welcome back — here's your store at a glance.</div></div><a class="btn ghost" href="index.html" target="_blank">Open storefront ↗</a></div>
    <div class="cards">
      <div class="stat"><b>${d.products.filter(p=>p.active!==false).length}</b><span>Active products</span></div>
      <div class="stat"><b>${orders.length}</b><span>Orders</span></div>
      <div class="stat"><b>${money(revenue)}</b><span>Order value (excl. cancelled)</span></div>
      <div class="stat"><b>${low}</b><span>Low stock (≤20)</span></div>
    </div>
    <div class="panel"><div class="ph"><h3>Recent orders</h3><button class="btn ghost sm" onclick="go('orders')">View all</button></div>
      <div class="pb" style="padding:0">${orders.length?`<table><thead><tr><th>Order</th><th>Items</th><th>Total</th><th>Status</th><th>When</th></tr></thead><tbody>${orders.slice(0,5).map(o=>`<tr><td><b>#${o.id}</b><div class="hint">${esc(o.name||'—')}</div></td><td>${(o.items||[]).reduce((s,i)=>s+i.qty,0)} items</td><td>${money(o.total)}</td><td><span class="chip ${o.status==='Cancelled'?'off':'on'}">${o.status}</span></td><td class="hint">${new Date(o.ts).toLocaleString('en-IN')}</td></tr>`).join('')}</tbody></table>`:`<div style="padding:40px;text-align:center;color:var(--muted)">No orders yet. Orders placed at checkout will appear here.</div>`}</div>
    </div>
    <div class="panel"><div class="ph"><h3>Quick actions</h3></div><div class="pb" style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn" onclick="go('products');setTimeout(()=>newProduct(),50)">+ Add product</button>
      <button class="btn ghost" onclick="go('content')">Edit homepage text</button>
      <button class="btn ghost" onclick="go('tv')">Update Saileela TV</button>
      <button class="btn ghost" onclick="go('data')">Export backup</button>
    </div></div>`;
}

/* ================= PRODUCTS ================= */
function products(){
  const d=D();
  document.getElementById('view').innerHTML=`
    <div class="topbar"><div><h1>Products</h1><div class="sub">${d.products.length} items · these power the shop, home and product pages.</div></div><button class="btn gold" onclick="newProduct()">+ Add product</button></div>
    <div class="panel"><div class="pb" style="padding:0;overflow:auto">
      <table><thead><tr><th></th><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Badge</th><th>Status</th><th></th></tr></thead>
      <tbody>${d.products.map(p=>`<tr>
        <td><div class="ticon">${Saileela.ICON[p.icon]||''}</div></td>
        <td><b>${esc(p.n)}</b><div class="hint">${p.r}★ · ${p.c} reviews</div></td>
        <td>${esc(p.cat)}</td>
        <td>${money(p.p)}${p.o?`<div class="hint"><s>${money(p.o)}</s></div>`:''}</td>
        <td>${p.stock||0}</td>
        <td>${p.badge?`<span class="chip badge">${esc(p.badge)}</span>`:'<span class="hint">—</span>'}</td>
        <td><span class="chip ${p.active!==false?'on':'off'}">${p.active!==false?'Active':'Hidden'}</span></td>
        <td><div class="rowacts"><button class="btn ghost sm" onclick="editProduct('${p.id}')">Edit</button><button class="btn danger sm" onclick="delProduct('${p.id}')">Delete</button></div></td>
      </tr>`).join('')}</tbody></table>
    </div></div>`;
}
function productModal(p){
  const d=D();const isNew=!p;
  p=p||{id:'',n:'',p:0,o:null,cat:d.cats[0]||'',icon:'lotus',badge:'',stock:0,r:4.8,c:0,active:true,desc:''};
  openModal(isNew?'New product':'Edit product',`
    <label><b>Product name</b><input id="f_n" value="${esc(p.n)}" placeholder="e.g. Brass Shirdi Diya"></label>
    <div class="grid2"><label><b>Price (₹)</b><input id="f_p" type="number" value="${p.p}"></label><label><b>Compare-at (₹, optional)</b><input id="f_o" type="number" value="${p.o||''}"></label></div>
    <div class="grid2"><label><b>Category</b><select id="f_cat">${d.cats.map(c=>`<option ${c===p.cat?'selected':''}>${esc(c)}</option>`).join('')}</select></label>
      <label><b>Icon / motif</b><select id="f_icon">${Saileela.ICON_KEYS.map(k=>`<option ${k===p.icon?'selected':''}>${k}</option>`).join('')}</select></label></div>
    <div class="grid3"><label><b>Badge</b><input id="f_badge" value="${esc(p.badge)}" placeholder="new / Bestseller"></label>
      <label><b>Stock</b><input id="f_stock" type="number" value="${p.stock||0}"></label>
      <label><b>Rating</b><input id="f_r" type="number" step="0.1" min="0" max="5" value="${p.r}"></label></div>
    <label><b>Reviews count</b><input id="f_c" type="number" value="${p.c}"></label>
    <label><b>Description</b><textarea id="f_desc" rows="3">${esc(p.desc)}</textarea></label>
    <label class="ck"><input type="checkbox" id="f_active" ${p.active!==false?'checked':''}> Active (visible in the store)</label>
  `,()=>{
    const d2=D();
    const np={id:p.id||('p'+Date.now()),n:val('f_n'),p:+val('f_p')||0,o:val('f_o')?+val('f_o'):null,cat:val('f_cat'),icon:val('f_icon'),badge:val('f_badge'),stock:+val('f_stock')||0,r:+val('f_r')||4.8,c:+val('f_c')||0,active:document.getElementById('f_active').checked,desc:val('f_desc')};
    if(!np.n){alert('Please enter a product name.');return;}
    const i=d2.products.findIndex(x=>x.id===np.id);
    if(i>=0)d2.products[i]=np;else d2.products.push(np);
    Store.save();closeModal();products();
  });
}
function newProduct(){productModal(null);}
function editProduct(id){productModal(D().products.find(p=>p.id===id));}
function delProduct(id){const d=D();const p=d.products.find(x=>x.id===id);if(!confirm('Delete "'+(p?p.n:'product')+'"? This cannot be undone.'))return;d.products=d.products.filter(x=>x.id!==id);Store.save();products();}

/* ================= CATEGORIES ================= */
function categories(){
  const d=D();
  document.getElementById('view').innerHTML=`
    <div class="topbar"><div><h1>Categories</h1><div class="sub">Used for shop filters and the homepage quick-links.</div></div></div>
    <div class="panel"><div class="pb">
      <div id="catList">${d.cats.map((c,i)=>`<div class="editor-row"><input value="${esc(c)}" onchange="renameCat(${i},this.value)"><button class="btn danger sm rm" onclick="delCat(${i})">Remove</button></div>`).join('')}</div>
      <div class="save-bar"><input id="newCat" placeholder="New category name" style="max-width:260px"><button class="btn" onclick="addCat()">+ Add category</button><span class="saved">Saved ✓</span></div>
      <p class="hint" style="margin-top:12px">Renaming a category here does not re-tag existing products automatically — update those products' category too if needed.</p>
    </div></div>`;
}
function addCat(){const v=val('newCat');if(!v)return;const d=D();if(d.cats.includes(v)){alert('That category already exists.');return;}d.cats.push(v);Store.save();categories();}
function renameCat(i,v){v=v.trim();if(!v)return;const d=D();d.cats[i]=v;Store.save();flash();}
function delCat(i){const d=D();if(!confirm('Remove category "'+d.cats[i]+'"?'))return;d.cats.splice(i,1);Store.save();categories();}

/* ================= ORDERS ================= */
const STATUSES=['New','Packed','Shipped','Delivered','Cancelled'];
function orders(){
  const d=D();const orders=d.orders||[];
  document.getElementById('view').innerHTML=`
    <div class="topbar"><div><h1>Orders</h1><div class="sub">${orders.length} order(s) · captured from checkout on this device.</div></div>${orders.length?`<button class="btn ghost" onclick="clearOrders()">Clear all</button>`:''}</div>
    ${orders.length?`<div class="panel"><div class="pb" style="padding:0;overflow:auto"><table><thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Payment</th><th>Status</th><th></th></tr></thead><tbody>${orders.map(o=>`<tr>
      <td><b>#${o.id}</b><div class="hint">${new Date(o.ts).toLocaleString('en-IN')}</div></td>
      <td>${esc(o.name||'—')}<div class="hint">${esc(o.phone||'')}</div></td>
      <td>${(o.items||[]).map(i=>esc(i.n)+' ×'+i.qty).join('<br>')}</td>
      <td>${money(o.total)}</td>
      <td>${esc(o.pay||'—')}</td>
      <td><select onchange="setStatus('${o.id}',this.value)" style="max-width:130px">${STATUSES.map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></td>
      <td><button class="btn danger sm" onclick="delOrder('${o.id}')">Delete</button></td>
    </tr>`).join('')}</tbody></table></div></div>`:`<div class="panel"><div class="pb" style="text-align:center;color:var(--muted);padding:50px">No orders yet.<div class="hint" style="margin-top:6px">Place a test order from the storefront checkout to see it here.</div></div></div>`}`;
}
function setStatus(id,s){const d=D();const o=d.orders.find(x=>x.id===id);if(o){o.status=s;Store.save();}}
function delOrder(id){const d=D();if(!confirm('Delete order #'+id+'?'))return;d.orders=d.orders.filter(x=>x.id!==id);Store.save();orders();}
function clearOrders(){if(!confirm('Delete ALL orders? This cannot be undone.'))return;const d=D();d.orders=[];Store.save();orders();}

/* ================= CONTENT ================= */
function content(){
  const s=D().settings;
  document.getElementById('view').innerHTML=`
    <div class="topbar"><div><h1>Content</h1><div class="sub">Homepage hero, announcement bar and festival banner.</div></div></div>
    <div class="panel"><div class="ph"><h3>Announcement bar</h3></div><div class="pb">
      <label><b>Devotional line (top strip)</b><input id="c_announceDeva" value="${esc(s.announceDeva)}"></label>
      <label><b>Message (HTML allowed)</b><input id="c_announceMsg" value="${esc(s.announceMsg)}"></label>
    </div></div>
    <div class="panel"><div class="ph"><h3>Homepage hero</h3></div><div class="pb">
      <label><b>Brand line (Devanagari)</b><input id="c_heroTagline" value="${esc(s.heroTagline)}"></label>
      <label><b>Headline (HTML allowed — &lt;br&gt;, &lt;em&gt;)</b><input id="c_heroTitle" value="${esc(s.heroTitle)}"></label>
      <label><b>Sub-text</b><textarea id="c_heroSub" rows="2">${esc(s.heroSub)}</textarea></label>
    </div></div>
    <div class="panel"><div class="ph"><h3>Festival banner</h3></div><div class="pb">
      <div class="grid2"><label><b>Festival title</b><input id="c_festivalName" value="${esc(s.festivalName)}"></label>
      <label><b>Countdown target date</b><input id="c_festivalDate" type="date" value="${esc(s.festivalDate)}"></label></div>
    </div></div>
    <div class="save-bar"><button class="btn gold" onclick="saveContent()">Save content</button><span class="saved">Saved ✓</span></div>`;
}
function saveContent(){
  const d=D();Object.assign(d.settings,{
    announceDeva:val('c_announceDeva'),announceMsg:val('c_announceMsg'),
    heroTagline:val('c_heroTagline'),heroTitle:val('c_heroTitle'),heroSub:val('c_heroSub'),
    festivalName:val('c_festivalName'),festivalDate:val('c_festivalDate')
  });Store.save();flash();
}

    <div class="topbar"><div><h1>Settings</h1><div class="sub">Store details, shipping and contact.</div></div></div>
    <div class="panel"><div class="ph"><h3>Store</h3></div><div class="pb">
      <div class="grid2"><label><b>Store name</b><input id="s_storeName" value="${esc(s.storeName)}"></label>
      <label><b>Currency symbol</b><input id="s_currency" value="${esc(s.currency)}"></label></div>
    </div></div>
    <div class="panel"><div class="ph"><h3>Shipping</h3></div><div class="pb">
      <div class="grid2"><label><b>Free shipping over (₹)</b><input id="s_freeShipThreshold" type="number" value="${s.freeShipThreshold}"></label>
      <label><b>Flat shipping fee (₹)</b><input id="s_shipFee" type="number" value="${s.shipFee}"></label></div>
    </div></div>
    <div class="panel"><div class="ph"><h3>Contact</h3></div><div class="pb">
      <div class="grid2"><label><b>WhatsApp number</b><input id="s_whatsapp" value="${esc(s.whatsapp)}" placeholder="+91…"></label>
      <label><b>Phone</b><input id="s_phone" value="${esc(s.phone)}"></label></div>
      <div class="grid2"><label><b>Email</b><input id="s_email" value="${esc(s.email)}"></label>

/* ================= SAILEELA TV ================= */
function tv(){
  const t=D().tv;
  const rows=(items,fields)=>items.map((it,i)=>`<div class="editor-row" data-i="${i}">${fields.map(f=>`<input data-k="${f.k}" value="${esc(it[f.k]||'')}" placeholder="${f.ph}" style="${f.w||''}">`).join('')}<button class="btn danger sm rm" onclick="this.parentNode.remove()">✕</button></div>`).join('');
  document.getElementById('view').innerHTML=`
    <div class="topbar"><div><h1>Saileela TV</h1><div class="sub">Everything on the Saileela TV page.</div></div></div>
    <div class="panel"><div class="ph"><h3>Live stream</h3></div><div class="pb">
      <div class="grid2"><label><b>Now-playing title</b><input id="tv_now" value="${esc(t.nowTitle)}"></label>
      <label><b>Live stream URL (YouTube Live / HLS)</b><input id="tv_live" value="${esc(t.liveUrl)}" placeholder="https://youtube.com/live/…"></label></div>
    </div></div>

    <div class="panel"><div class="ph"><h3>Programmes</h3><button class="btn ghost sm" onclick="addRow('progBox',[{k:'n',ph:'Name'},{k:'w',ph:'When'},{k:'icon',ph:'icon'},{k:'d',ph:'Description'}])">+ Add</button></div>
      <div class="pb"><div id="progBox">${rows(t.programmes,[{k:'n',ph:'Name'},{k:'w',ph:'When'},{k:'icon',ph:'icon',w:'max-width:96px'},{k:'d',ph:'Description'}])}</div></div></div>

    <div class="panel"><div class="ph"><h3>Daily schedule</h3><button class="btn ghost sm" onclick="addRow('schedBox',[{k:'t',ph:'Time'},{k:'n',ph:'Programme'},{k:'d',ph:'Note'}])">+ Add</button></div>
      <div class="pb"><div id="schedBox">${rows(t.schedule,[{k:'t',ph:'5:30 AM',w:'max-width:120px'},{k:'n',ph:'Programme'},{k:'d',ph:'Note'}])}</div></div></div>

    <div class="panel"><div class="ph"><h3>Distribution</h3></div><div class="pb">
      <h4 style="margin-bottom:8px;font-size:.95rem">DTH <button class="btn ghost sm" onclick="addRow('dthBox',[{k:'name',ph:'Provider'},{k:'num',ph:'Channel no.'}])">+ Add</button></h4>
      <div id="dthBox">${rows(t.distribution.dth,[{k:'name',ph:'Provider'},{k:'num',ph:'Channel no.',w:'max-width:160px'}])}</div>
      <h4 style="margin:16px 0 8px;font-size:.95rem">Cable <button class="btn ghost sm" onclick="addRow('cableBox',[{k:'name',ph:'Network'},{k:'num',ph:'Channel no.'}])">+ Add</button></h4>
      <div id="cableBox">${rows(t.distribution.cable,[{k:'name',ph:'Network'},{k:'num',ph:'Channel no.',w:'max-width:160px'}])}</div>
      <h4 style="margin:16px 0 8px;font-size:.95rem">OTT & Apps <button class="btn ghost sm" onclick="addRow('ottBox',[{k:'name',ph:'Platform'},{k:'num',ph:'Label'}])">+ Add</button></h4>
      <div id="ottBox">${rows(t.distribution.ott,[{k:'name',ph:'Platform'},{k:'num',ph:'Label',w:'max-width:160px'}])}</div>
    </div></div>

    <div class="panel"><div class="ph"><h3>Social media</h3><button class="btn ghost sm" onclick="addRow('socBox',[{k:'plat',ph:'Platform'},{k:'count',ph:'Count'},{k:'label',ph:'Label'},{k:'url',ph:'URL'},{k:'color',ph:'Colour'}])">+ Add</button></div>
      <div class="pb"><div id="socBox">${rows(t.socials,[{k:'plat',ph:'Platform',w:'max-width:120px'},{k:'count',ph:'1.2M',w:'max-width:90px'},{k:'label',ph:'subscribers'},{k:'url',ph:'https://'},{k:'color',ph:'#c4302b',w:'max-width:120px'}])}</div>
      <p class="hint">Platform names YouTube / Facebook / Instagram / WhatsApp get the right icon automatically.</p></div></div>

    <div class="save-bar"><button class="btn gold" onclick="saveTV()">Save Saileela TV</button><span class="saved">Saved ✓</span></div>`;
}
function addRow(boxId,fields){
  const box=document.getElementById(boxId);
  const div=document.createElement('div');div.className='editor-row';
  div.innerHTML=fields.map(f=>`<input data-k="${f.k}" placeholder="${f.ph}" style="${f.w||''}">`).join('')+`<button class="btn danger sm rm" onclick="this.parentNode.remove()">✕</button>`;
  box.appendChild(div);
}
function gather(boxId){
  return [...document.getElementById(boxId).querySelectorAll('.editor-row')].map(row=>{
    const o={};row.querySelectorAll('input').forEach(inp=>o[inp.dataset.k]=inp.value.trim());return o;
  }).filter(o=>Object.values(o).some(v=>v));
}
function saveTV(){
  const d=D();
  d.tv.nowTitle=val('tv_now');d.tv.liveUrl=val('tv_live');
  d.tv.programmes=gather('progBox');
  d.tv.schedule=gather('schedBox');
  d.tv.distribution={dth:gather('dthBox'),cable:gather('cableBox'),ott:gather('ottBox')};
  d.tv.socials=gather('socBox');
  Store.save();flash();
}

/* ================= DATA ================= */
function data(){
  document.getElementById('view').innerHTML=`
    <div class="topbar"><div><h1>Data</h1><div class="sub">Back up, restore or reset everything.</div></div></div>
    <div class="note">Your store data lives in this browser (localStorage). Export regularly to keep a backup, and hand the JSON to your developer when moving to WooCommerce.</div>
    <div class="panel"><div class="ph"><h3>Export</h3></div><div class="pb">
      <p class="hint" style="margin-bottom:12px">Download everything — products, categories, orders, settings and Saileela TV — as one JSON file.</p>
      <button class="btn" onclick="exportData()">⬇ Download backup (.json)</button>
    </div></div>
    <div class="panel"><div class="ph"><h3>Import</h3></div><div class="pb">
      <p class="hint" style="margin-bottom:10px">Paste a previously exported JSON and replace the current data.</p>
      <textarea id="importBox" rows="6" placeholder='{ "products": [...], "settings": {...} }'></textarea>
      <div class="save-bar"><button class="btn" onclick="importData()">Replace data</button><label class="ck" style="margin:0"><input type="file" accept="application/json" id="importFile" onchange="importFromFile(event)" style="width:auto"> or upload a file</label></div>
    </div></div>
    <div class="panel"><div class="ph"><h3>Reset</h3></div><div class="pb">
      <p class="hint" style="margin-bottom:12px">Restore the original demo catalogue and settings. This erases your changes and orders.</p>
      <button class="btn danger" onclick="resetData()">Reset to defaults</button>
    </div></div>`;
}
function exportData(){
  const blob=new Blob([Store.exportJSON()],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='saileela-store-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();
}
function importData(){
  const t=val('importBox');if(!t){alert('Paste JSON first, or upload a file.');return;}
  try{Store.importJSON(t);alert('Data imported successfully.');go(tab);}catch(e){alert('That JSON could not be read: '+e.message);}
}
function importFromFile(ev){
  const f=ev.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{Store.importJSON(r.result);alert('Data imported successfully.');go(tab);}catch(e){alert('That file could not be read: '+e.message);}};
  r.readAsText(f);
}
function resetData(){if(!confirm('Reset everything to the original defaults? Your changes and orders will be lost.'))return;Store.reset();go(tab);}

/* ---- boot ---- */
if(sessionStorage.getItem('sl_admin')==='1'){show();}
</script>
</body></html>
