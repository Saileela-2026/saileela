<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cart & Checkout — Saileela Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Manrope:wght@400;500;600;700;800&family=Tiro+Devanagari+Hindi:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="shop.html">
<div id="site-header"></div>

<section class="page-hero"><div class="wrap"><div class="crumb"><a href="index.html">Home</a><span>›</span>Cart</div><h1>Your cart</h1><p>Review your order, then check out securely. Everything ships with devotion, straight from Shirdi.</p></div></section>

<section class="block"><div class="wrap" id="cartRoot"></div></section>

<div id="site-footer"></div>
<script src="app.js"></script>
<script>
  const root=document.getElementById('cartRoot');
  let pay='UPI';
  function render(){
    const items=Saileela.Cart.detailed();
    if(!items.length){ root.innerHTML=`<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M6 8h12l-1 12H7L6 8Z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg><h2 style="color:var(--kumkum-deep);margin:0 0 8px">Your cart is empty</h2><p style="margin:0 0 22px">May Baba guide you to something meaningful.</p><a href="shop.html" class="btn btn-primary">Browse the collection</a></div>`; return; }
    const st=Saileela.settings(); const thr=+st.freeShipThreshold||999; const fee=+st.shipFee||60;
    const sub=Saileela.Cart.subtotal(); const ship=sub>=thr?0:fee; const total=sub+ship;
    root.innerHTML=`<div class="cart-grid">
      <div>
        <div class="cart-list">${items.map((c,i)=>`<div class="cart-row"><div class="ct" style="background:${Saileela.tint(i)}"><div style="width:70%">${Saileela.ICON[c.icon]}</div></div>
          <div class="ci"><div class="cl">${c.cat}</div><h4>${c.n}</h4><div class="cp">${Saileela.money(c.p)}</div><div class="rm" role="button" tabindex="0" onclick="rm('${c.id}')" onkeydown="if(event.key==='Enter')rm('${c.id}')">Remove</div></div>
          <div class="qty"><button onclick="setq('${c.id}',${c.qty-1})" aria-label="Decrease">−</button><span>${c.qty}</span><button onclick="setq('${c.id}',${c.qty+1})" aria-label="Increase">+</button></div></div>`).join('')}</div>
      </div>
      <div class="summary">
        <h3>Order summary</h3>
        <div class="row"><span>Subtotal</span><span>${Saileela.money(sub)}</span></div>
        <div class="row"><span>Shipping</span><span>${ship?Saileela.money(ship):'Free'}</span></div>
        ${ship?`<div class="row" style="color:var(--marigold-deep);font-size:.82rem"><span>Add ${Saileela.money(thr-sub)} for free shipping</span></div>`:''}
        <div class="row total"><span>Total</span><b>${Saileela.money(total)}</b></div>
        <div style="margin-top:18px"><div style="font-size:.82rem;font-weight:600;margin-bottom:8px">Payment method</div>
          <div class="pay-opts">${['UPI','Card','Cash on delivery'].map(o=>`<label class="pay-opt ${pay===o?'sel':''}" onclick="setPay('${o}')"><input type="radio" name="pay" ${pay===o?'checked':''}> ${o}</label>`).join('')}</div></div>
        <div style="font-size:.82rem;font-weight:600;margin:20px 0 10px">Delivery details</div>
        <div class="field"><label>Mobile Number</label><div class="phone-in"><span>+91</span><input id="bPhone" type="tel" inputmode="numeric" maxlength="10" placeholder="10-digit mobile number"></div></div>
        <div class="field"><label>Full Name</label><input id="bName" placeholder="Full name"></div>
        <div class="field"><label>Complete Address</label><textarea id="bAddr" rows="2" placeholder="House / flat no., building, street, area"></textarea></div>
        <div class="field"><label>Landmark <span style="text-transform:none;letter-spacing:0;color:var(--ink-faint)">(optional)</span></label><input id="bLandmark" placeholder="Nearby landmark"></div>
        <div class="field-row">
          <div class="field"><label>Pincode</label><input id="bPin" type="text" inputmode="numeric" maxlength="6" placeholder="6-digit PIN"></div>
          <div class="field"><label>City</label><input id="bCity" placeholder="City"></div>
        </div>
        <div class="field"><label>State</label><input id="bState" placeholder="State"></div>
        <button class="btn btn-primary" style="width:100%;justify-content:center" onclick="placeOrder()">Place order · ${Saileela.money(total)}</button>
        <div class="drawer-foot" style="border:none;background:none;padding:14px 0 0"><div class="note">🕉 Ships from Shirdi · secure Razorpay checkout · 7-day returns</div></div>
      </div></div>`;
  }
  window.rm=id=>{Saileela.Cart.remove(id);Saileela.bump();render();};
  window.setq=(id,q)=>{Saileela.Cart.setQty(id,q);Saileela.bump();render();};
  window.setPay=o=>{pay=o;render();};
  window.placeOrder=()=>{
    const items=Saileela.Cart.detailed(); if(!items.length)return;
    const st=Saileela.settings(); const thr=+st.freeShipThreshold||999; const fee=+st.shipFee||60;
    const sub=Saileela.Cart.subtotal(); const ship=sub>=thr?0:fee;
    const g=id=>{const el=document.getElementById(id);return el?el.value.trim():'';};
    const phone=g('bPhone').replace(/\D/g,''), pin=g('bPin').replace(/\D/g,'');
    const name=g('bName'), addr=g('bAddr'), landmark=g('bLandmark'), city=g('bCity'), state=g('bState');
    // validation (needed for shipping, so applies to COD + online)
    if(!name){ alert('Please enter your full name.'); return; }
    if(phone.length!==10){ alert('Please enter a valid 10-digit mobile number.'); return; }
    if(!addr){ alert('Please enter your complete address.'); return; }
    if(pin.length!==6){ alert('Please enter a valid 6-digit pincode.'); return; }
    if(!city){ alert('Please enter your city.'); return; }
    if(!state){ alert('Please enter your state.'); return; }
    const fullAddress=addr+(landmark?(', near '+landmark):'')+', '+city+', '+state+' - '+pin;
    const order={
      items:items.map(c=>({id:c.id,n:c.n,p:c.p,qty:c.qty})),
      subtotal:sub, shipping:ship, total:sub+ship, pay:pay,
      name, phone,
      address:fullAddress,               /* composite, for admin display */
      addressLine:addr, landmark, pincode:pin, city, state  /* structured, for Shiprocket */
    };
    const finish=(payInfo)=>{
      if(payInfo) order.payment=payInfo;
      Saileela.placeOrder(order);
      Saileela.Cart.clear();Saileela.bump();
      const paidLine = payInfo
        ? `<p style="margin:0 0 8px"><b>Payment successful</b> — Test mode 🙏</p><p style="margin:0 0 22px;font-size:.86rem;color:var(--ink-soft)">Payment ID: ${payInfo.id}</p>`
        : `<p style="margin:0 0 22px">Order placed 🙏 — we'll confirm on WhatsApp. Pay cash on delivery.</p>`;
      root.innerHTML=`<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="12" cy="12" r="10"/><path d="m8 12 2.5 2.5L16 9"/></svg><h2 style="color:var(--kumkum-deep);margin:0 0 8px">Thank you 🙏</h2>${paidLine}<a href="shop.html" class="btn btn-primary">Continue shopping</a></div>`;
    };
    if(pay==='Cash on delivery'){ finish(null); return; }
    Saileela.payWithRazorpay(order, (resp)=>{ finish({id:resp.razorpay_payment_id||'(test)', mode:'razorpay-test'}); });
  };
  document.addEventListener('cart:render',render);
  render();
</script>
</body></html>
