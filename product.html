<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product — Saileela Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Manrope:wght@400;500;600;700;800&family=Tiro+Devanagari+Hindi:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="shop.html">
<div id="site-header"></div>

<section class="page-hero"><div class="wrap"><div class="crumb"><a href="index.html">Home</a><span>›</span><a href="shop.html">Shop</a><span>›</span><span id="crumbName">Product</span></div></div></section>

<section class="block"><div class="wrap">
  <div class="pd-grid">
    <div class="pd-gallery reveal">
      <div class="main-tile" id="mainTile"></div>
      <div class="pd-thumbs" id="thumbs"></div>
    </div>
    <div class="pd-info reveal" id="info"></div>
  </div>
</div></section>

<section class="block" style="background:var(--cream)"><div class="wrap">
  <div class="head reveal"><div class="eyebrow">You may also like</div><h2>More from Shirdi</h2></div>
  <div class="prod-grid" id="related"></div>
</div></section>

<div id="site-footer"></div>
<script src="app.js"></script>
<script>
  const id=new URLSearchParams(location.search).get('id')||'p4';
  const p=Saileela.findProduct(id)||Saileela.CATALOG[0];
  document.title=p.n+' — Saileela Store';
  document.getElementById('crumbName').textContent=p.n;
  document.getElementById('mainTile').style.background=Saileela.tint(2);
  document.getElementById('mainTile').innerHTML=`<div style="width:52%">${Saileela.ICON[p.icon]}</div>`;
  document.getElementById('thumbs').innerHTML=[0,1,2].map(i=>`<div class="th ${i===0?'active':''}" style="background:${Saileela.tint(i)}"><div style="width:60%">${Saileela.ICON[p.icon]}</div></div>`).join('');
  const off=p.o?Math.round((1-p.p/p.o)*100):0;
  document.getElementById('info').innerHTML=`
    <div class="cat-label">${p.cat}</div><h1>${p.n}</h1>
    <div class="stars">★★★★★ <span>${p.r} · ${p.c} devotee reviews</span></div>
    <div class="pd-price"><span class="now">${Saileela.money(p.p)}</span>${p.o?`<s>${Saileela.money(p.o)}</s><span class="off">${off}% off</span>`:''}</div>
    <p class="desc">${p.desc}</p>
    <div class="pd-actions">
      <div class="qty"><button onclick="chQty(-1)" aria-label="Decrease">−</button><span id="qty">1</span><button onclick="chQty(1)" aria-label="Increase">+</button></div>
      <button class="btn btn-primary" onclick="Saileela.addToCart('${p.id}',qty())">Add to cart</button>
      <button class="btn btn-line" onclick="Saileela.addToCart('${p.id}',qty());location.href='cart.html'">Buy now</button>
    </div>
    <a class="btn btn-wa" id="waBtn" href="#" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor" style="width:18px;height:18px"><path d="M12 2a10 10 0 0 0-8.5 15.2L2 22l4.9-1.4A10 10 0 1 0 12 2Z"/></svg> Ask on WhatsApp</a>
    <div class="pd-trust">
      <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 2l7 4v6c0 5-3 8-7 10-4-2-7-5-7-10V6l7-4Z"/><path d="m8.5 12 2.5 2.5 4.5-4.5"/></svg> Handpicked & dispatched from Shirdi 423109</div>
      <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 7h13v10H3zM16 10h3l2 3v4h-5"/><circle cx="7" cy="18" r="1.7"/><circle cx="18" cy="18" r="1.7"/></svg> Tracked pan-India delivery · ships in 2–4 days</div>
      <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M21 12a9 9 0 1 1-6.2-8.5"/><path d="m9 12 2 2 4-5"/></svg> 7-day easy returns · secure UPI, cards & COD</div>
    </div>`;
  (function(){const wa=(Saileela.settings().whatsapp||'').replace(/\D/g,'');const b=document.getElementById('waBtn');if(b){const msg=encodeURIComponent('Hi Saileela, I would like to know more about: '+p.n);b.href=wa?('https://wa.me/'+wa+'?text='+msg):'contact.html';}})();
  let q=1; window.qty=()=>q; window.chQty=d=>{q=Math.max(1,q+d);document.getElementById('qty').textContent=q;};
  const rel=Saileela.CATALOG.filter(x=>x.id!==p.id&&x.cat===p.cat).slice(0,4);
  const pool=rel.length?rel:Saileela.CATALOG.filter(x=>x.id!==p.id).slice(0,4);
  document.getElementById('related').innerHTML=pool.map((x,i)=>Saileela.productCard(x,i)).join('');
  document.querySelectorAll('.reveal').forEach(el=>el.classList.add('in'));
</script>
</body></html>
