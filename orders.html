<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Orders — Saileela</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="orders.html">
<div id="site-header"></div>
<section class="page-hero"><div class="wrap"><div class="crumb"><a href="index.html">Home</a><span>›</span>My Orders</div><h1>My Orders</h1><p>Your orders placed on this device.</p></div></section>
<section class="block"><div class="wrap" style="max-width:820px;margin:0 auto" id="ordersView"></div></section>
<div id="site-footer"></div>
<script src="app.js"></script>
<script>
(function(){
  const host=document.getElementById('ordersView');
  const M=Saileela.money;
  const orders=Saileela.myOrders?Saileela.myOrders():[];
  const lookup=`<div class="panel-card" style="margin-bottom:18px"><div class="ord-lookup"><input id="oid" placeholder="Have an order number? e.g. SL123456"><button class="btn btn-primary" onclick="var v=document.getElementById('oid').value.trim().toUpperCase();if(v)location.href='order.html?id='+encodeURIComponent(v)">View order</button></div></div>`;
  if(!orders.length){ host.innerHTML=lookup+'<div class="panel-card"><h2>No orders yet</h2><p class="muted">Orders you place will appear here on this device. Explore the <a href="shop.html">shop</a> to get started.</p></div>'; return; }
  const list=orders.map(o=>`<a class="ord-row" href="order.html?id=${o.id}">
      <div><b>#${o.id}</b><div class="muted">${new Date(o.ts).toLocaleDateString('en-IN',{year:'numeric',month:'short',day:'numeric'})} \u00b7 ${(o.items||[]).reduce((n,i)=>n+i.qty,0)} item(s)</div></div>
      <div class="ord-row-r"><b>${M(o.total)}</b><span class="ord-badge sm">${o.status||'New'}</span></div>
    </a>`).join('');
  host.innerHTML=lookup+'<div class="ord-list">'+list+'</div>';
})();
</script>
</body></html>
