<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Order — Saileela</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="order.html">
<div id="site-header"></div>
<section class="page-hero"><div class="wrap"><div class="crumb"><a href="index.html">Home</a><span>›</span><a href="orders.html">My Orders</a><span>›</span>Order</div><h1 id="ordTitle">Your order</h1></div></section>
<section class="block"><div class="wrap" id="orderView" style="max-width:820px;margin:0 auto"></div></section>
<div id="site-footer"></div>
<script src="app.js"></script>
<script>
(function(){
  const id=new URLSearchParams(location.search).get('id');
  const host=document.getElementById('orderView');
  const o=id&&Saileela.getOrder?Saileela.getOrder(id):null;
  if(!o){ host.innerHTML='<div class="panel-card"><h2>Order not found</h2><p class="muted">We couldn\u2019t find this order on this device. Orders are saved to the browser they were placed on. If you have your order number, check <a href="orders.html">My Orders</a>, or contact us on WhatsApp <a href="https://wa.me/916262072020" target="_blank" rel="noopener">+91 62620 72020</a> and we\u2019ll help.</p></div>'; return; }
  const st=Saileela.settings(); const M=Saileela.money;
  const steps=['New','Packed','Shipped','Delivered'];
  const cancelled=o.status==='Cancelled';
  const cur=Math.max(0, steps.indexOf(o.status));
  const timeline = cancelled
    ? '<div class="ord-cancel">This order was cancelled.</div>'
    : '<div class="ord-steps">'+steps.map((s,i)=>`<div class="ord-step ${i<=cur?'done':''}"><span class="dot"></span><span>${s}</span></div>`).join('')+'</div>';
  const rows=(o.items||[]).map((it,i)=>`<tr><td>${i+1}</td><td>${it.n}</td><td class="r">${it.qty}</td><td class="r">${M(it.p)}</td><td class="r">${M(it.p*it.qty)}</td></tr>`).join('');
  const gst = st.gstin?`<div>GSTIN: ${st.gstin}</div>`:'';
  const payLine = o.payment&&o.payment.id ? `${o.pay} · Ref ${o.payment.id}` : (o.pay||'—');
  host.innerHTML=`
    <div class="ord-confirm no-print">
      <div class="ord-tick">\u2713</div>
      <div><h2 style="margin:0">Thank you \uD83D\uDE4F</h2><p class="muted" style="margin:2px 0 0">Order <b>#${o.id}</b> placed on ${new Date(o.ts).toLocaleString('en-IN')}</p></div>
    </div>
    <div class="ord-actions no-print">
      <span class="ord-badge">${cancelled?'Cancelled':('Status: '+(o.status||'New'))}</span>
      <button class="btn btn-primary" onclick="window.print()">\uD83D\uDDA8\uFE0F Print / Save invoice</button>
    </div>
    ${timeline}
    <div id="invoice" class="invoice">
      <div class="inv-top">
        <div class="inv-brand">
          <div class="inv-name">Saileela</div>
          <div class="inv-co">Sai Leela Devotainment Private Limited</div>
          <div class="muted">A/P Nimgaon, Shirdi, Next to Vishwashani Apartment,<br>Tal. Rahata \u2013 423107, Maharashtra, India</div>
          <div class="muted">saililatv@gmail.com \u00b7 +91 6262072020</div>
          ${gst}
        </div>
        <div class="inv-meta">
          <div class="inv-h">INVOICE</div>
          <div><b>#${o.id}</b></div>
          <div class="muted">${new Date(o.ts).toLocaleDateString('en-IN',{year:'numeric',month:'long',day:'numeric'})}</div>
          <div class="muted">Status: ${o.status||'New'}</div>
        </div>
      </div>
      <div class="inv-parties">
        <div><div class="inv-lbl">Bill / Ship to</div><b>${o.name||''}</b><div class="muted">${(o.address||'')}<br>\uD83D\uDCDE ${o.phone||''}${o.email?(' \u00b7 '+o.email):''}</div></div>
        <div><div class="inv-lbl">Payment</div>${payLine}</div>
      </div>
      <table class="inv-table"><thead><tr><th>#</th><th>Item</th><th class="r">Qty</th><th class="r">Rate</th><th class="r">Amount</th></tr></thead><tbody>${rows}</tbody></table>
      <div class="inv-totals">
        <div><span>Subtotal</span><span>${M(o.subtotal!=null?o.subtotal:o.total)}</span></div>
        ${o.shipping?`<div><span>Shipping</span><span>${M(o.shipping)}</span></div>`:`<div><span>Shipping</span><span>Free</span></div>`}
        ${o.codFee?`<div><span>COD charges</span><span>${M(o.codFee)}</span></div>`:''}
        <div class="inv-grand"><span>Total</span><span>${M(o.total)}</span></div>
      </div>
      <div class="inv-foot muted">Thank you for shopping with Saileela \uD83D\uDE4F &nbsp;|&nbsp; This is a computer-generated invoice.<br>Sai Leela Devotainment Private Limited is an independent devotee store, not affiliated with Shree Saibaba Sansthan Trust, Shirdi.</div>
    </div>`;
})();
</script>
</body></html>
